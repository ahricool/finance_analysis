[project]
name = "finance_analysis"
version = "0.0.0"
description = "Finance Analysis"
requires-python = ">=3.13,<3.14"
dependencies = [
    "akshare>=1.18.64",
    "celery[redis]>=5.6.3",
    "cryptography>=44.0.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "easyquotation>=0.7.7",
    "exchange-calendars>=4.5.0",
    "fastapi>=0.136.0",
    "httpx[socks]>=0.28.1",
    "imgkit>=1.2.0",
    "jinja2>=3.1.0",
    "json-repair>=0.55.1",
    "litellm!=1.82.7,!=1.82.8,>=1.83.0,<2.0.0",
    "longbridge>=4.3.3",
    "markdown2>=2.4.0",
    "numpy>=2.0.0",
    "openai>=1.0.0",
    "pandas>=2.2.0",
    "pillow>=11.0.0",
    "psycopg2-binary>=2.9.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "pyyaml>=6.0",
    "redis>=5.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.14.0",
    "tenacity>=8.2.0",
    "tickflow>=0.1.24",
    "tiktoken>=0.8.0",
    "uvicorn[standard]>=0.34.0",
    "yfinance>=1.5.2",
    "ipdb>=0.13.13",
    "pyarrow>=20.0.0,<24.0.0",
    "websockets>=15,<17",
    "paramiko>=3.5,<5",
    "mcp>=1.26,<2",
    "pglast>=7,<8",
]

[project.scripts]
finance-analysis = "finance_analysis.__main__:main"
finance-analysis-stream = "finance_analysis.market_stream.__main__:main"
finance-analysis-crypto-stream = "finance_analysis.crypto_stream.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
dev-dependencies = [
    "flake8",
    "pytest",
    "pytest-asyncio",
]

[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".git", "__pycache__", ".env", "venv", ".venv"]

[tool.bandit]
exclude_dirs = ["tests", "test_*.py"]
skips = ["B101"]  # assert 语句在测试中是允许的

[tool.pytest.ini_options]
markers = ["network: opt-in tests requiring external or explicitly configured disposable services"]
