name: finance-analysis

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-analysis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: finance-analysis-redis
    restart: unless-stopped
    # Redis only stores disposable broker/cache state. Disabling persistence
    # prevents a corrupt AOF from blocking the entire stack after a hard stop.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  server:
    image: ghcr.io/ahricool/finance_analysis:${IMAGE_TAG:-latest}
    container_name: finance-analysis-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QUANT_ARTIFACT_ROOT: /workspace/data/quant
    expose:
      - "8000"
    volumes:
      - ./data:/workspace/data
      - ./data:/data:ro
      - ./.env:/workspace/.env:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:8000/status"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 30s

  web:
    image: ghcr.io/ahricool/finance_analysis_web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: finance-analysis-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O /dev/null http://127.0.0.1/openapi.json"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  worker:
    image: ghcr.io/ahricool/finance_analysis:${IMAGE_TAG:-latest}
    container_name: finance-analysis-celery
    restart: unless-stopped
    # Fallback for direct Compose maintenance. deploy.sh uses an unlimited
    # Docker stop deadline and never automatically kills in-flight tasks.
    stop_signal: SIGTERM
    stop_grace_period: 1h
    command:
      [
        "celery",
        "-A",
        "finance_analysis.tasks.celery.app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=prefork",
        "--autoscale=3,1",
        "--max-tasks-per-child=50",
        "-Q",
        "celery,alerts,analysis,ingestion,maintenance",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      QUANT_ARTIFACT_ROOT: /workspace/data/quant
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A finance_analysis.tasks.celery.app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    image: ghcr.io/ahricool/finance_analysis:${IMAGE_TAG:-latest}
    container_name: finance-analysis-celery-beat
    restart: unless-stopped
    command:
      [
        "celery",
        "-A",
        "finance_analysis.tasks.celery.app:celery_app",
        "beat",
        "--loglevel=INFO"
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env:ro
    healthcheck:
      test:
        [
          "CMD", "python", "-c",
          "from finance_analysis.tasks.celery.schedule.heartbeat import read_beat_status; assert read_beat_status() == 'active'",
        ]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s

  qlib-worker:
    image: ghcr.io/ahricool/finance_analysis_qlib:${IMAGE_TAG:-latest}
    platform: linux/amd64
    container_name: finance-analysis-qlib-worker
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 4h
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      QUANT_ARTIFACT_ROOT: /workspace/data/quant
    volumes:
      - ./data/quant:/workspace/data/quant
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import qlib; assert qlib.__version__ == '0.9.7'\" && celery -A qlib_worker.celery_app:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  streamer:
    image: ghcr.io/ahricool/finance_analysis:${IMAGE_TAG:-latest}
    container_name: finance-analysis-streamer
    restart: unless-stopped
    command: ["finance-analysis-stream"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/workspace/data
      - ./.env:/workspace/.env:ro

volumes:
  postgres_data:
    name: finance-analysis-postgres-data
